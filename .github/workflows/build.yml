name: Build VoxelVehicles
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout VoxelCore
        uses: actions/checkout@v4
        with:
          repository: VoxelHorizons/VoxelCore
          path: VoxelCore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install VoxelCore API
        run: mvn -U -f VoxelCore/pom.xml install -DskipTests
      - name: Build and test
        run: mvn -U clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: VoxelVehicles-mc1.19.4-26.2
          path: target/VoxelVehicles-*.jar
          if-no-files-found: error
