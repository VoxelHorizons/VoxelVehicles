name: VoxelVehicles
main: org.voxelhorizons.vehicles.VoxelVehicles
version: '${project.version}'
api-version: '1.19'
depend: [VoxelCore]
description: VoxelCore vehicle physics and display-based vehicles.
author: VoxelHorizons
commands:
  voxelvehicles:
    aliases: [vv]
    description: Vehicle administration.
    usage: /vv <inventory|chest remove|spawn|remove|reload|list>
permissions:
  voxelvehicles.admin:
    default: op
  voxelvehicles.inventory:
    default: true
