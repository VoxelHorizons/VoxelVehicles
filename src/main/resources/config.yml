# Movement is processed synchronously on the main thread, never in a packet callback.
physics:
  autosave-ticks: 200
  max-substep: 0.25
render:
  # Interpolate world movement on parked vehicles.
  interpolation-ticks: 1
  # Important: do not disable this on mounted vehicles. The passenger's
  # movement is already smoothed by Minecraft; model snapping causes jitter.
  # 1 = smooth one-tick interpolation; 2-3 can be tested on slower networks.
  mounted-interpolation-ticks: 1
  # Client smooths the model pitch/roll metadata separately from teleports.
  tilt-interpolation-ticks: 2

# Verify loaded entities and sweep stale vehicle renderers without loading chunks.
# 600 ticks = 30 seconds. Minimum is 100 ticks (5 seconds).
maintenance:
  cleanup-ticks: 600
  # Orphan renderer cleanup is spread across server ticks, not performed in
  # one giant scan when players have thousands of chunks loaded.
  # Maximum chunks checked each tick while a maintenance sweep is pending.
  # Safe range: 1-256. Use a lower value if many players explore at once.
  cleanup-chunks-per-tick: 16

# Chest GUI: title glyphs are resolved by VoxelCore at open time.
# These are defaults only: change them to any authored VoxelCore font aliases.
inventory:
  # Press F (swap hands) while riding to open this vehicle's menu.
  # E opens the personal inventory client-side on ItemDisplay mounts and
  # cannot be intercepted by Bukkit without changing the client entity type.
  open-with-swap-hand: true
  # Minimum chest GUI height to fit the model preview panel. Individual
  # vehicles choose storage row count with properties.vehicle.inventory.rows.
  rows: 3
  titles:
    without-storage: "&f:offset_-8::vehicle_inventory:"
    with-storage: "&f:offset_-8::vehicle_inventory_storage:"

  # Your shifted overlay puts the preview one column further LEFT.
  # Slot indices are 0-based: 10 = middle row, second column.
  # To fill the preview panel, give its model an enlarged display.gui transform.
  preview-slot: 10

  # Render an invisible VoxelCore item in every protected slot (all slots
  # except the preview and enabled cargo). This prevents stray shift-clicks
  # from treating decorative slots as empty. Accepts an item ID OR a model
  # reference; the latter resolves to its uniquely matching VoxelCore item.
  # Set to "" to leave decorative slots empty (still protected).
  fill-item: "voxel:ui/blank"
  # Give invisible fillers the same hover display name/lore as the preview.
  # They retain their original transparent model and never become cargo.
  fill-copy-preview-meta: true

  # Six cargo slots per row for the updated resource-pack overlay.
  # This can be overridden by each vehicle's properties.vehicle.inventory
  # storage-slots setting; old config.yml files must be updated manually.
  # Rows 4-6 require extended resource-pack background overlays.
  storage-slots:
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 12
    - 13
    - 14
    - 15
    - 16
    - 17
    - 21
    - 22
    - 23
    - 24
    - 25
    - 26
    # Optional fourth through sixth rows:
    - 30
    - 31
    - 32
    - 33
    - 34
    - 35
    - 39
    - 40
    - 41
    - 42
    - 43
    - 44
    - 48
    - 49
    - 50
    - 51
    - 52
    - 53

# Paper remains authoritative; this feed contains only visual state and Paper
# entity UUIDs for a Geyser extension, never inventory contents/permissions.
bedrock:
  projection:
    enabled: true
    # Empty auto-detects a loaded local Geyser-Spigot plugin's data directory.
    # For proxy/remote Geyser use a mount to the ACTUAL Geyser data folder.
    geyser-data-directory: ''
    # Main-thread capture interval; writes are asynchronous and changes coalesce.
    # Heartbeat rewrites unchanged state every 10 seconds (stale snapshots expire).
    interval-ticks: 5
    # Unique per backend when several servers share one (proxy) Geyser folder, e.g. 'survival'.
    # Writes vehicles-<feed-id>.json; the VoxelCore Geyser extension merges all feeds.
    feed-id: ''
    # Geyser fixes a Bedrock entity's model at spawn. When a vehicle's model changes,
    # re-send it (hide/show, 1.18+) to Bedrock viewers so the new model is applied.
    # Without a local Geyser API every viewer is re-sent (brief Java flicker).
    resend-on-model-change: true
    # Ticks to wait before that re-send. 0 for a local/mounted Geyser folder; use ~40 when a
    # proxy Geyser pulls feeds over the network (bedrock.remote_sync in VoxelCore).
    resend-delay-ticks: 0
